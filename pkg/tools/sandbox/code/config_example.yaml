# Code Executor 配置示例文件
# 这个文件展示了所有可用的配置选项及其默认值

# 执行器配置
executor:
  # 执行超时时间（毫秒）
  timeout: 60000
  # 内存限制（MB）
  memory_limit: 512
  # CPU 限制（核心数）
  cpu_limit: 2
  # 支持的编程语言列表
  supported_languages:
    - go
    - python
    - javascript
    - bash
  # 执行模式: local（本地执行）, container（容器执行）, auto（自动选择）
  execution_mode: local

# 代码分析器配置
analyzer:
  # 启用网络操作检测
  enable_network_detection: true
  # 启用文件系统操作检测
  enable_filesystem_detection: true
  # 启用进程操作检测
  enable_process_detection: true
  # 启用加密操作检测
  enable_crypto_detection: true
  # 启用数据库操作检测
  enable_database_detection: true
  # 启用代码质量检查
  enable_quality_check: true
  # 自定义规则文件路径（可选）
  custom_rules_file: ""
  # 严格模式（发现任何问题都标记为不安全）
  strict_mode: false

# Yaegi Go 解释器配置
yaegi:
  # 预加载标准库
  preload_stdlib: true
  # 预加载的包列表
  preload_packages:
    - fmt
    - strings
    - time
    - math
  # 启用编译缓存
  enable_cache: true
  # 缓存容量（条目数）
  cache_capacity: 100

# Docker 容器配置
container:
  # 启用容器执行
  enabled: false
  # 默认镜像映射
  default_images:
    python: "python:3.11-alpine"
    javascript: "node:18-alpine"
    go: "golang:1.21-alpine"
    bash: "alpine:latest"
  # CPU 限制（例如: "0.5" 表示 0.5 核）
  cpu_limit: "0.5"
  # 内存限制（例如: "512m" 表示 512MB）
  memory_limit: "512m"
  # 网络模式: none（无网络）, bridge（桥接）, host（主机）
  network_mode: "none"
  # 容器执行超时时间（纳秒）
  timeout: 30000000000  # 30 seconds
  # 自动清理容器
  auto_cleanup: true
  # 启用容器池
  enable_pool: false
  # 容器池最小容器数
  pool_min_size: 2
  # 容器池最大容器数
  pool_max_size: 10

