name: License Compliance Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  license-check:
    name: Check AGPL-3.0 License Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check license coverage
        id: coverage
        run: |
          echo "正在检查 Go 文件的许可证覆盖情况..."
          echo ""

          total_go=$(find . -name "*.go" -type f | wc -l)
          licensed=$(grep -rl "SPDX-License-Identifier\|GNU Affero General Public License" --include="*.go" . 2>/dev/null | wc -l)
          missing=$(find . -name "*.go" -type f ! -exec grep -q "SPDX-License-Identifier\|GNU Affero General Public License" {} \; | wc -l)

          echo "📊 许可证覆盖统计:"
          echo "  总 Go 文件数: $total_go"
          echo "  有许可声明: $licensed"
          echo "  缺少许可: $missing"
          echo "  覆盖率: $(awk "BEGIN {printf \"%.1f%%\", $licensed/$total_go*100}")"

          # 设置输出变量
          echo "total=$total_go" >> $GITHUB_OUTPUT
          echo "licensed=$licensed" >> $GITHUB_OUTPUT
          echo "missing=$missing" >> $GITHUB_OUTPUT
          echo "coverage=$(awk "BEGIN {printf \"%.1f\", $licensed/$total_go*100}")" >> $GITHUB_OUTPUT

          # 检查覆盖率是否达标
          if [ $missing -gt 0 ]; then
            echo ""
            echo "❌ 发现 $missing 个文件缺少许可证声明！"
            echo ""
            echo "以下文件缺少许可证:"
            find . -name "*.go" -type f ! -exec grep -q "SPDX-License-Identifier\|GNU Affero General Public License" {} \; | head -20
            echo ""
            exit 1
          fi

          echo ""
          echo "✅ 所有 Go 文件都包含正确的许可证声明！"

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const total = '${{ steps.coverage.outputs.total }}';
            const licensed = '${{ steps.coverage.outputs.licensed }}';
            const missing = '${{ steps.coverage.outputs.missing }}';

            const comment = `## 📜 许可证检查报告

            | 指标 | 数值 |
            |------|------|
            | 总 Go 文件 | ${total} |
            | 有许可声明 | ${licensed} |
            | 缺少许可 | ${missing} |
            | 覆盖率 | ${coverage}% |

            ${missing === '0' ? '✅ 所有文件都包含 AGPL-3.0 许可证声明' : '❌ 部分文件缺少许可证声明'}

            ---
            *由 License Compliance Workflow 自动生成*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check LICENSE file
        run: |
          echo "检查 LICENSE 文件..."
          if [ ! -f "LICENSE" ]; then
            echo "❌ 错误: 未找到 LICENSE 文件"
            exit 1
          fi

          if ! grep -q "GNU Affero General Public License" LICENSE; then
            echo "❌ 错误: LICENSE 文件不是 AGPL-3.0"
            exit 1
          fi

          echo "✅ LICENSE 文件存在且为 AGPL-3.0"

      - name: Verify SPDX identifiers
        run: |
          echo "验证 SPDX 标识符格式..."

          # 检查是否有文件使用了错误的 SPDX 标识符
          wrong_spdx=$(grep -r "SPDX-License-Identifier:" --include="*.go" . | \
                       grep -v "AGPL-3.0-or-later" | \
                       grep -v "SPDX-License-Identifier: AGPL-3.0" | \
                       wc -l)

          if [ $wrong_spdx -gt 0 ]; then
            echo "⚠️  警告: 发现 $wrong_spdx 个文件使用了非 AGPL-3.0 的 SPDX 标识符"
            echo ""
            echo "以下文件可能需要检查:"
            grep -r "SPDX-License-Identifier:" --include="*.go" . | \
              grep -v "AGPL-3.0-or-later" | \
              grep -v "SPDX-License-Identifier: AGPL-3.0" | \
              head -10
            echo ""
          fi

          # 统计正确的 SPDX 标识符
          correct_spdx=$(grep -rl "SPDX-License-Identifier.*AGPL-3.0" --include="*.go" . | wc -l)
          echo "✅ $correct_spdx 个文件使用正确的 AGPL-3.0 SPDX 标识符"

      - name: Generate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "生成许可证覆盖率徽章..."
          coverage=${{ steps.coverage.outputs.coverage }}
          color="brightgreen"

          if (( $(echo "$coverage < 100" | bc -l) )); then
            color="yellow"
          fi
          if (( $(echo "$coverage < 80" | bc -l) )); then
            color="red"
          fi

          echo "许可证覆盖率: ${coverage}%"

  license-scan:
    name: FOSSA License Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FOSSA scan
        uses fossas/fossa-action@v1
        with:
          fossa-api-key: ${{ secrets.FOSSA_API_KEY }}
        continue-on-error: true

  summary:
    name: License Check Summary
    runs-on: ubuntu-latest
    needs: license-check
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## 📜 许可证合规性检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go 文件许可覆盖 | ${{ steps.coverage.outputs.coverage }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 总文件数 | ${{ steps.coverage.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 有许可声明 | ${{ steps.coverage.outputs.licensed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 缺少许可 | ${{ steps.coverage.outputs.missing }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LICENSE 文件 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.coverage.outputs.missing }}" = "0" ]; then
            echo "### ✅ 所有检查通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 检查失败" >> $GITHUB_STEP_SUMMARY
          fi
