# File Operation Skill Definition
# 文件操作技能的完整定义

id: "file_operation"
name: "文件操作技能"
description: "安全的文件系统操作，包括读写、搜索、权限管理等，具有沙箱安全机制"
version: "2.0.0"
category: "file"
author: "AgentFramework Team"
license: "AGPL-3.0-or-later"

# 前置条件
prerequisites:
  - type: "filesystem_access"
    description: "检查文件系统访问权限"
    check: "test -w ."
    required: true

  - type: "sandbox_dir"
    description: "检查沙箱目录是否存在"
    check: "test -d {{.Config.SandboxDir}}"
    auto_fix: true
    fix_command: "mkdir -p {{.Config.SandboxDir}}"

  - type: "permissions"
    description: "检查文件操作权限"
    check: "test_permission file_write"
    required: true

# 触发条件
triggers:
  - "user mentions file, read, write, save, load"
  - "user wants to access filesystem"
  - "user provides file path"
  - "user needs to process files"
  - "user mentions directory, folder"

# 工作流定义
workflow:
  # 步骤1: 验证输入
  - id: "validate_input"
    name: "验证输入参数"
    action: "validate"
    parameters:
      required_fields: "operation,path"
    timeout: 5s

  # 步骤2: 检查沙箱权限
  - id: "check_sandbox"
    name: "检查沙箱权限"
    action: "execute"
    description: "确保路径在沙箱允许范围内"
    timeout: 5s

  # 步骤3: 解析路径
  - id: "resolve_path"
    name: "解析路径"
    action: "execute"
    description: "解析相对路径，检查路径遍历攻击"
    timeout: 5s

  # 步骤4: 执行操作
  - id: "execute_operation"
    name: "执行文件操作"
    action: "execute"
    description: "根据操作类型执行相应操作"
    timeout: 30s
    parameters:
      use_template: "file_{{.Operation | lower}}"

  # 步骤5: 验证结果
  - id: "verify_result"
    name: "验证操作结果"
    action: "validate"
    description: "验证操作是否成功完成"
    skip_if: "result.success == false"
    timeout: 5s

  # 步骤6: 记录操作
  - id: "log_operation"
    name: "记录操作日志"
    action: "execute"
    description: "记录文件操作到日志"
    skip_if: "config.disable_logging"
    timeout: 2s

  # 步骤7: 清理资源
  - id: "cleanup"
    name: "清理资源"
    action: "cleanup"
    description: "清理临时资源"
    timeout: 5s

# 配置
config:
  # 沙箱配置
  sandbox_dir: "./sandbox"
  allowed_paths:
    - "./sandbox"
    - "./data"
    - "./output"
  denied_paths:
    - "/etc"
    - "/sys"
    - "/proc"

  # 文件大小限制
  max_file_size: 104857600  # 100MB

  # 允许的文件扩展名
  allowed_extensions:
    - ".txt"
    - ".md"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".xml"
    - ".csv"
    - ".log"

  # 禁止的文件扩展名
  denied_extensions:
    - ".exe"
    - ".dll"
    - ".so"
    - ".dylib"
    - ".bin"

  # 搜索配置
  search_max_results: 1000
  search_recursive: true

  # 日志配置
  log_operations: true
  log_level: "info"

# 元数据
metadata:
  supported_operations:
    - "read"      # 读取文件
    - "write"     # 写入文件
    - "delete"    # 删除文件
    - "list"      # 列出目录
    - "search"    # 搜索文件
    - "copy"      # 复制文件
    - "move"      # 移动文件
    - "mkdir"     # 创建目录
    - "rmdir"     # 删除目录
    - "chmod"     # 修改权限
    - "exists"    # 检查存在
    - "info"      # 获取信息

  examples_count: 2
  requires_filesystem: true
  safe_for_production: true
  compatible_agents:
    - "ChatAgent"
    - "ReActAgent"
    - "WorkerAgent"

# 使用统计
stats:
  total_calls: 0
  success_rate: 0
  average_duration: 0
