# =============================================================================
# Agent Framework - Slack 渠道配置模板
# =============================================================================
#
# Slack App 渠道配置示例
#
# 使用方法：
#   1. 在 https://api.slack.com/apps 创建 App
#   2. 配置 Bot Token 和 App-Level Token
#   3. 添加必要权限（chat:write, im:history 等）
#   4. 运行: ./afcli slack serve
#
# =============================================================================

channels:
  slack:
    enabled: true

    # Bot Token（xoxb-xxx）
    botToken: "${SLACK_BOT_TOKEN}"

    # App-Level Token（xapp-xxx，用于 Socket Mode）
    appToken: "${SLACK_APP_TOKEN}"

    # Signing Secret（用于验证请求）
    signingSecret: "${SLACK_SIGNING_SECRET}"

    # =========================================================================
    # Socket Mode（推荐）
    # =========================================================================
    # - 无需公网 URL
    # - 使用 WebSocket 连接 Slack
    # - 需要 App-Level Token
    #
    socketMode: true

    # =========================================================================
    # HTTP Mode（需要公网 URL）
    # =========================================================================
    # socketMode: false
    # 需要配置 Request URL: https://your-domain.com/slack/events

    # =========================================================================
    # 会话策略
    # =========================================================================
    # 允许的频道列表（空列表表示允许所有）
    allowedChannels: []
    # allowedChannels:
    #   - "C12345678"    # 频道 ID
    #   - "D12345678"    # 私信 ID

# =============================================================================
# 配置示例：限制特定频道
# =============================================================================
#
# channels:
#   slack:
#     enabled: true
#     botToken: "${SLACK_BOT_TOKEN}"
#     appToken: "${SLACK_APP_TOKEN}"
#     signingSecret: "${SLACK_SIGNING_SECRET}"
#     socketMode: true
#     allowedChannels:
#       - "C12345678"
#       - "C87654321"

# =============================================================================
# 环境变量配置示例
# =============================================================================
#
# SLACK_BOT_TOKEN=xoxb-123456789-abc123...
# SLACK_APP_TOKEN=xapp-1-A123456789-abc123...
# SLACK_SIGNING_SECRET=abc123def456...
#
