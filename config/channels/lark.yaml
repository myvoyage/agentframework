# =============================================================================
# Agent Framework - 飞书/Lark 渠道配置模板
# =============================================================================
#
# 飞书渠道完整配置示例，支持：
#   - feishu: 国内版飞书
#   - lark: 国际版 Lark
#
# 连接模式：
#   - websocket: WebSocket 长连接（推荐，无需公网 URL）
#   - webhook: HTTP Webhook（需要公网 URL）
#
# 使用方法：
#   1. 复制相关配置到 host.yaml 的 channels.lark 部分
#   2. 在飞书开放平台创建企业自建应用
#   3. 获取 AppID 和 AppSecret
#   4. 运行: ./afcli lark serve
#
# =============================================================================

channels:
  lark:
    # =========================================================================
    # 基础配置
    # =========================================================================
    enabled: true
    domain: "feishu"                    # feishu(国内版) / lark(国际版)

    # 应用配置（从飞书开放平台获取）
    appId: "${LARK_APP_ID}"             # cli_xxx 格式
    appSecret: "${LARK_APP_SECRET}"

    # =========================================================================
    # 连接模式
    # =========================================================================
    #
    # 方式一：WebSocket 长连接（推荐）
    # - 无需公网 URL
    # - 内网穿透支持
    # - 低延迟
    #
    connectionMode: "websocket"

    # 方式二：Webhook 模式
    # - 需要公网 URL
    # - 支持消息加密
    #
    # connectionMode: "webhook"
    # port: 8089
    # encryptKey: "${LARK_ENCRYPT_KEY}"
    # verifyToken: "${LARK_VERIFY_TOKEN}"

    # =========================================================================
    # 会话策略（参考官方 OpenClaw 插件）
    # =========================================================================
    #
    # 私信策略 (dmPolicy):
    #   - pairing: 配对模式，支持会话绑定
    #   - allowlist: 白名单模式，仅允许指定用户
    #   - open: 开放模式，所有用户都可以私信
    #   - disabled: 禁用私信
    #
    dmPolicy: "pairing"
    dmAllowlist: []                     # 私信白名单用户 ID

    # 群聊策略 (groupPolicy):
    #   - open: 开放模式，响应所有群聊 @消息
    #   - allowlist: 白名单模式，仅响应指定群
    #   - disabled: 禁用群聊
    #
    groupPolicy: "open"
    groupAllowlist: []                  # 群聊白名单

    # =========================================================================
    # 流式回复配置
    # =========================================================================
    streaming: true                     # 启用流式回复
    textChunkLimit: 2000                # 文本分块大小（飞书限制）

    # =========================================================================
    # 功能配置
    # =========================================================================
    typingIndicator: true               # 显示"正在输入..."状态
    resolveSenderNames: true            # 解析发送者名称

    # =========================================================================
    # 限流配置
    # =========================================================================
    rateLimitEnabled: true              # 启用限流
    rateLimitPerSec: 10                 # 每秒最大请求数

    # =========================================================================
    # Bot 信息
    # =========================================================================
    botName: "AI 智能助手"               # Bot 显示名称

