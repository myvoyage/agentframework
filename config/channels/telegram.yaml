# =============================================================================
# Agent Framework - Telegram 渠道配置模板
# =============================================================================
#
# Telegram Bot 渠道配置示例
#
# 使用方法：
#   1. 在 Telegram 中通过 @BotFather 创建 Bot，获取 Token
#   2. 配置 Webhook URL 或使用长轮询
#   3. 运行: ./afcli telegram serve
#
# =============================================================================

channels:
  telegram:
    enabled: true

    # Bot Token（从 @BotFather 获取）
    botToken: "${TELEGRAM_BOT_TOKEN}"

    # =========================================================================
    # Webhook 模式（推荐生产环境）
    # =========================================================================
    # webhookUrl: "https://your-domain.com/telegram/webhook"
    # port: 8443

    # =========================================================================
    # 长轮询模式（开发环境）
    # =========================================================================
    # 无需 Webhook URL，直接轮询获取更新
    # 仅需要 botToken

    # =========================================================================
    # 会话策略
    # =========================================================================
    # 允许的聊天 ID 列表（空列表表示允许所有）
    allowedChats: []
    # allowedChats:
    #   - 123456789
    #   - -1001234567890

# =============================================================================
# 配置示例：限制特定聊天
# =============================================================================
#
# channels:
#   telegram:
#     enabled: true
#     botToken: "${TELEGRAM_BOT_TOKEN}"
#     webhookUrl: "https://example.com/telegram"
#     allowedChats:
#       - 123456789           # 用户 ID
#       - -1001234567890      # 群组 ID（负数）

# =============================================================================
# 环境变量配置示例
# =============================================================================
#
# TELEGRAM_BOT_TOKEN=123456789:ABCdefGHIjklMNOpqrSTUvwxYZ
#
